version: '3.8'

services:
  #Database PostgreSQL
  postgres:
    image: postgres:latest
    container_name: db_postgres
    ports:
      - "5432:5432"
    networks:
      - app_network
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: secure_files
    volumes:
      - postgres_data:/var/lib/postgresql/data

  #Cache
  redis:
    image: redis:latest
    container_name: cache_redis
    ports:
      - "6379:6379"
    networks:
      - app_network

  #BackEnd API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://user:password123@db_postgres:5432/secure_files
      REDIS_URL: redis://cache_redis:6379
    volumes:
      - ./backend:/app
    networks:
      - app_network
    depends_on:
      - postgres
      - redis

  #frontEnd
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    ports:
      - "3000:3000"
    networks:
      - app_network
    env_file:
      - .env.example
    environment:
      - REACT_APP_API_URL=${API_URL}
      - REACT_APP_MAX_FILE_SIZE=${MAX_FILE_SIZE}
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  #Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    ports:
      - "9090:9090"
    networks:
      - app_network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  #Visualization - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    ports:
      - "3001:3000"
    networks:
      - app_network

# Networks
networks:
  app_network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
  prometheus_data:
